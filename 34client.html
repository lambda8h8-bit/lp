<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Form Validation</title>
</head>
<body>

<h2>Registration Form</h2>

<form id="myForm" novalidate>
  <label>Name</label><br>
  <input type="text" id="name"><br>
  <span id="nameErr"></span><br><br>

  <label>Roll No</label><br>
  <input type="text" id="rollno"><br>
  <span id="rollErr"></span><br><br>

  <label>Mobile</label><br>
  <input type="text" id="mobile"><br>
  <span id="mobileErr"></span><br><br>

  <label>Email</label><br>
  <input type="text" id="email"><br>
  <span id="emailErr"></span><br><br>

  <label>Password</label><br>
  <input type="password" id="password"><br>
  <span id="passErr"></span><br><br>

  <label>Confirm Password</label><br>
  <input type="password" id="confirm"><br>
  <span id="confirmErr"></span><br><br>

  <button type="submit">Submit</button>
  <div id="success"></div>
</form>

<script>
  document.getElementById("myForm").onsubmit = function(e) {
    e.preventDefault();

    let ok = true;
    document.getElementById("success").textContent = "";

    // Name
    if (document.getElementById("name").value.trim().length < 3) {
      document.getElementById("nameErr").textContent = "Name must be at least 3 characters";
      ok = false;
    } else {
      document.getElementById("nameErr").textContent = "";
    }

    // Roll No
    if (!/^[A-Za-z0-9]+$/.test(document.getElementById("rollno").value.trim())) {
      document.getElementById("rollErr").textContent = "Roll No must be letters/numbers only";
      ok = false;
    } else {
      document.getElementById("rollErr").textContent = "";
    }

    // Mobile
    if (!/^[0-9]{10}$/.test(document.getElementById("mobile").value.trim())) {
      document.getElementById("mobileErr").textContent = "Enter a valid 10-digit mobile number";
      ok = false;
    } else {
      document.getElementById("mobileErr").textContent = "";
    }

    // Email
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(document.getElementById("email").value.trim())) {
      document.getElementById("emailErr").textContent = "Enter a valid email";
      ok = false;
    } else {
      document.getElementById("emailErr").textContent = "";
    }

    // Password
    if (document.getElementById("password").value.length < 6) {
      document.getElementById("passErr").textContent = "Password must be at least 6 characters";
      ok = false;
    } else {
      document.getElementById("passErr").textContent = "";
    }

    // Confirm Password
    if (document.getElementById("confirm").value !== document.getElementById("password").value ||
        document.getElementById("confirm").value === "") {
      document.getElementById("confirmErr").textContent = "Passwords do not match";
      ok = false;
    } else {
      document.getElementById("confirmErr").textContent = "";
    }

    // Show success
    if (ok) {
      document.getElementById("success").textContent = "✓ Form submitted successfully!";
    }
  };
</script>

</body>
</html>
